<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1018">
<meta name="description" content="MLBB draft practice with pick and ban tips, builds and counters for Patch 2.2.23.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Draft Room">
<title>MLBB Draft Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: draft-room HUD — Blue column | phase + advisor | Red column, hero pool below; stacks on phones */
:root{
  --bg:#eef0f5; --panel:#ffffff; --panel2:#f5f6fa; --line:#d7dbe6; --fg:#151a26; --muted:#5c6478;
  --blue:#1f6fe0; --blue-soft:#e3edfd; --red:#d83a3a; --red-soft:#fbe6e6;
  --gold:#b98a12; --good:#1e9a5a; --warn:#c77a0a; --bad:#cc3344;
  --tS:#d9480f; --tA:#b8860b; --tB:#2f7d4f; --tC:#55657e; --tD:#8a8f9c;
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1018; --panel:#141a26; --panel2:#1a2232; --line:#273145; --fg:#e7ebf3; --muted:#8d97ad;
  --blue:#4b8dff; --blue-soft:#15284a; --red:#ff5a5a; --red-soft:#3d1a1f;
  --gold:#e6b84a; --good:#3ccf86; --warn:#f0a43a; --bad:#ff6b7a;
  --tS:#ff7a3d; --tA:#e6b84a; --tB:#4fc286; --tC:#8d9bb4; --tD:#6b7386; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1018; --panel:#141a26; --panel2:#1a2232; --line:#273145; --fg:#e7ebf3; --muted:#8d97ad;
  --blue:#4b8dff; --blue-soft:#15284a; --red:#ff5a5a; --red-soft:#3d1a1f;
  --gold:#e6b84a; --good:#3ccf86; --warn:#f0a43a; --bad:#ff6b7a;
  --tS:#ff7a3d; --tA:#e6b84a; --tB:#4fc286; --tC:#8d9bb4; --tD:#6b7386; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font:700 24px/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
.patch{font:600 12px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--gold);color:var(--gold);border-radius:4px;background:transparent}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:7px 11px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* phase strip */
.phase{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.phase-now{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.turn{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.04em}
.turn.B{color:var(--blue)} .turn.R{color:var(--red)}
.steps{display:flex;gap:3px;flex-wrap:wrap}
.step{width:18px;height:8px;border-radius:2px;background:var(--line);position:relative}
.step.sban{height:5px;align-self:center}
.step.B.done{background:var(--blue)} .step.R.done{background:var(--red)}
.step.cur{outline:2px solid var(--gold);outline-offset:1px}
.phase .hint{color:var(--muted);font-size:13px}

/* board */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.team{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.team h2{margin:0;font:700 15px var(--display);text-transform:uppercase;letter-spacing:.08em;padding:9px 12px;display:flex;justify-content:space-between;align-items:center}
.team.B h2{background:var(--blue-soft);color:var(--blue)} .team.R h2{background:var(--red-soft);color:var(--red)}
.team.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.bans{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:10px 12px 4px}
.ban{height:30px;border:1px dashed var(--line);border-radius:5px;font:600 11px var(--display);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;padding:2px;color:var(--muted);overflow:hidden}
.ban.filled{border-style:solid;text-decoration:line-through;background:var(--panel2);color:var(--fg)}
.ban.off{opacity:.35}
.ban.cur,.pick.cur{border:2px solid var(--gold)}
.picks{display:grid;gap:6px;padding:8px 12px 12px}
.pick{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:50px;background:var(--panel2)}
.pick.empty{background:transparent;border-style:dashed;color:var(--muted)}
.mono{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;font:700 14px var(--display);color:#fff;letter-spacing:.02em}
.pick .nm{font:600 15px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .sub{font-size:12px;color:var(--muted)}
.lane{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}

/* advisor */
.advisor{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
.advisor h3,.section h3{margin:0;font:700 13px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sugg{display:grid;gap:6px}
.sg{display:grid;grid-template-columns:38px minmax(0,1fr) 46px;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.sg:hover{border-color:var(--gold)}
.sg .nm{font:600 15px var(--display);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font-size:11.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.pos{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.chip.neg{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.score{font:700 17px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.tier{font:700 11px var(--display);padding:1px 5px;border-radius:3px;color:#fff}
.tS{background:var(--tS)} .tA{background:var(--tA)} .tB{background:var(--tB)} .tC{background:var(--tC)} .tD{background:var(--tD)}
.pf{font:600 10.5px var(--display);text-transform:uppercase;letter-spacing:.05em;padding:1px 5px;border-radius:3px;border:1px solid}
.pf.buff{color:var(--good)} .pf.nerf{color:var(--bad)} .pf.rework{color:var(--gold)} .pf.adj{color:var(--muted)}
.done-box{padding:6px 2px;display:grid;gap:8px}

/* analysis */
.analysis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
.meters{display:grid;gap:6px}
.meter{display:grid;grid-template-columns:92px minmax(0,1fr) 22px;gap:8px;align-items:center;font-size:13px}
.bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.B .bar i{background:var(--blue)} .R .bar i{background:var(--red)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.split .p{background:#d9822b} .split .m{background:#7b5cd6}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px}
.warns{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.warns li{font-size:13px;padding:6px 8px;border-radius:6px;background:var(--panel2);border-left:3px solid var(--warn)}
.warns li.ok{border-left-color:var(--good)}
.warns li.tip{border-left-color:var(--muted)}
.mu{display:grid;gap:5px}
.mu-row{display:grid;grid-template-columns:minmax(0,1fr) 62px minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
.mu-row .l{text-align:right;color:var(--blue);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu-row .r{color:var(--red);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu-row .c{text-align:center;font:600 11px var(--display);text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 0}
.mu-row .c.eB{color:var(--blue);border-color:var(--blue)} .mu-row .c.eR{color:var(--red);border-color:var(--red)}

/* pool */
.pool{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;flex:1 1 160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.hero{display:grid;grid-template-columns:30px minmax(0,1fr);gap:7px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 6px}
.hero .mono{width:30px;height:30px;font-size:11px}
.hero .nm{font:600 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .meta{display:flex;gap:4px;align-items:center}
.hero:hover:not(:disabled){border-color:var(--gold)}
.hero:disabled{opacity:.28;cursor:not-allowed}
.hero.B-used{opacity:.45;border-color:var(--blue)} .hero.R-used{opacity:.45;border-color:var(--red)}
.patchbox{font-size:13px;color:var(--muted);display:grid;gap:6px}
.patchbox b{color:var(--fg)}
.patchbox ul{margin:0;padding-left:18px}
footer{font-size:12px;color:var(--muted);line-height:1.6}
footer a{color:inherit}
details summary{cursor:pointer;font:700 13px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* role colors for monograms */
.mono{position:relative;overflow:hidden;align-content:center;gap:0;line-height:1}
.mono .ri{width:56%;height:56%;fill:none;stroke:rgba(255,255,255,.95);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono b{font:700 10px var(--display);letter-spacing:.02em;margin-top:1px}
.hero .mono b{font-size:8.5px}
.mono.badge{display:block;padding:0}
.mono.badge svg{width:100%;height:100%;display:block}
.mono.badge .face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.items li{display:flex;align-items:center;gap:6px}
.ii{width:22px;height:22px;border-radius:4px;flex:none}
.pl{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.pl .ii{width:18px;height:18px}
.rF{background:#b5532a}.rT{background:#3e6b8c}.rA{background:#7a3a8c}.rM{background:#5b4fc4}.rK{background:#b8862a}.rS{background:#2e8a6e}


button.ban{background:transparent;cursor:pointer;font:600 11px var(--display);color:var(--muted)}
button.ban.filled{color:var(--fg)}
.ban.skipped{font-style:italic;opacity:.6}
.pick[role="button"]{cursor:pointer}
.pick:focus-visible,.ban:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.pr{display:flex;gap:6px;align-items:center}
.info{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font:700 12px var(--display);color:var(--muted);display:grid;place-items:center;padding:0}
.info:hover{border-color:var(--gold);color:var(--fg)}
button.step{border:0;padding:0;cursor:pointer}
.step.sk{opacity:.4}
.choosing{font:600 13px var(--display);text-transform:uppercase;letter-spacing:.05em}
.choosing.B{color:var(--blue)} .choosing.R{color:var(--red)}
.ctl{display:flex;flex-wrap:wrap;gap:6px}
.ctl .btn{padding:5px 9px;font-size:13px}
.ctl:empty{display:none}
.report{grid-column:1 / -1}
.report h4{margin:0 0 6px;font:700 12px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rphase{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:110px minmax(0,1fr) 60px;gap:8px;align-items:center;font-size:13.5px}
.pbar{height:10px;border-radius:5px;background:var(--red);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue)}
.plead{font:600 12px var(--display);text-align:right;color:var(--muted)}
.plead.B{color:var(--blue)} .plead.R{color:var(--red)}
.rcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.rcol{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;align-content:start}
.rcol.B{border-top:3px solid var(--blue)} .rcol.R{border-top:3px solid var(--red)}
.rtype{display:grid;gap:3px}
.rtype .chip{justify-self:start;font-weight:600;color:var(--fg)}
.rscore{font-size:13px;color:var(--muted)} .rscore b{font:700 20px var(--display);margin-right:4px}
.rscore.good b{color:var(--good)} .rscore.mid b{color:var(--warn)} .rscore.bad b{color:var(--bad)}
.rck ul{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:13px}
.rck li.y span{color:var(--good)} .rck li.n{color:var(--muted)} .rck li.n span{color:var(--bad)}
@media (max-width:600px){.prow{grid-template-columns:84px minmax(0,1fr) 46px}.rck ul{grid-template-columns:1fr}}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;padding-top:4px}
.pager:empty{display:none}
.pbtn,.pnum{background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:40px;min-width:40px;padding:0 12px;font:600 13.5px var(--display)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pnums{display:flex;gap:4px;align-items:center}
.pnum.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pbtn:hover:not(:disabled),.pnum:hover:not(.on){border-color:var(--gold)}
.pdots{color:var(--muted);padding:0 2px}
.pinfo{width:100%;text-align:center;font-size:12.5px;color:var(--muted)}
.win{display:grid;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.win h4{margin:0;font:700 12px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wnums{display:flex;justify-content:space-between;font:600 14px var(--display)}
.wnums b{font-size:26px;font-variant-numeric:tabular-nums}
.wb{color:var(--blue)} .wr{color:var(--red)}
.wbar{height:12px;border-radius:6px;background:var(--red);overflow:hidden}
.wbar i{display:block;height:100%;background:var(--blue)}
.wf{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.wf li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:4px}
.wfav{font:600 12px var(--display);color:var(--muted)}
.wfav.B{color:var(--blue)} .wfav.R{color:var(--red)}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.tab{flex:1;background:var(--panel2);border:0;border-right:1px solid var(--line);padding:6px 4px;font:600 12.5px var(--display);color:var(--muted)}
.tab:last-child{border-right:0}
.tab.on{background:var(--fg);color:var(--bg)}
.lchips{display:flex;flex-wrap:wrap;gap:5px}
.lchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font:600 12px var(--display);color:var(--muted);position:relative}
.lchip.open{color:var(--fg);border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.lchip.open::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.lchip.on{background:var(--gold);border-color:var(--gold);color:#111}
.lgh{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center}
.lbtn{background:var(--panel);cursor:pointer}
.lbtn:hover{border-color:var(--gold);color:var(--fg)}
.lbtn.set{border-color:var(--gold);color:var(--gold)}
.advs{display:grid;gap:6px}
.advs input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.advres{display:flex;flex-wrap:wrap;gap:5px}
.advres:empty{display:none}
.ar{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px 3px 3px;font:600 13px var(--display)}
.ar:hover,.ar:focus-visible{border-color:var(--gold)}
.ar .mono{width:24px;height:24px}
.hint{font-size:12.5px;color:var(--muted)}
.ghead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gtop{display:flex;gap:10px;align-items:center}
.gtop .mono{width:46px;height:46px}
.gname{font:700 18px var(--display);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.gbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;align-content:start;min-width:0}
.gbox h4{margin:0;font:700 12px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.items{margin:0;padding-left:22px;display:grid;gap:3px;font-weight:600}
.items li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:13.5px}
.kv span:first-child{color:var(--muted)}
.src{font-size:12px;padding:5px 8px;border-radius:6px;border-left:3px solid var(--muted);background:var(--panel)}
.src.r{border-left-color:var(--good)}
.clist{display:grid;gap:4px}
.crow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:left}
.crow:hover{border-color:var(--gold)}
.crow .mono{width:28px;height:28px}
.cn{font:600 13.5px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{font:600 12px var(--display);color:var(--good);font-variant-numeric:tabular-nums}
.lanec{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:center}
.lcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.lc{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 5px;text-align:left;min-width:0}
.lc:hover{border-color:var(--gold)}
.lc .mono{width:26px;height:26px}
.cv.fb{color:var(--muted);font-weight:500}
.lc .chip{grid-column:2 / -1;justify-self:start;font-size:10.5px}
@media (max-width:420px){.lcs{grid-template-columns:1fr}}
.tips{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14px}

 tour:["bB","bR","bB","bR","bB","bR","pB","pR","pR","pB","pB","pR","bR","bB","bR","bB","pR","pB","pB","pR"],

let state={fmt:"tour",meta:"ranked",lang:"en",slots:{},skip:{},hist:[],sel:null,guide:null,team5:null,timerOn:true,advTab:"best",advLane:"",laneOv:{}};
const METAS=["ranked","proAll","proMY","proPH","proID"];
const seqKeys=fmt=>{const c={};return FORMATS[fmt].map(x=>{c[x]=c[x]||0;return x+(c[x]++)})};
try{const o=JSON.parse(localStorage.getItem("mlbbDraft2")||"null");if(o&&FORMATS[o.fmt]){state=Object.assign(state,o);const ks=seqKeys(state.fmt);
 for(const k in state.slots)if(!ks.includes(k)||!BY[state.slots[k]])delete state.slots[k];if(!Array.isArray(state.hist))state.hist=[];if(state.guide&&!BY[state.guide])state.guide=null;state.sel=null}
 else{const old=JSON.parse(localStorage.getItem("mlbbDraft")||"null");if(old&&FORMATS[old.fmt]){state.fmt=old.fmt;state.meta=old.meta;state.lang=old.lang;const ks=seqKeys(old.fmt);(old.actions||[]).forEach((n,i)=>{if(BY[n]&&ks[i])state.slots[ks[i]]=n})}}
 if(!METAS.includes(state.meta))state.meta="ranked";if(!["en","ms"].includes(state.lang))state.lang="en"}catch(e){}
function save(){try{localStorage.setItem("mlbbDraft2",JSON.stringify(state))}catch(e){}}
const rankedFmt=()=>state.fmt!=="tour";

function derive(){
 const keys=seqKeys(state.fmt);
 const d={keys,bans:{B:[],R:[]},picks:{B:[],R:[]},banSlots:{B:[],R:[]},pickSlots:{B:[],R:[]},used:new Set()};
 d.maxBans={B:keys.filter(k=>k.startsWith("bB")).length,R:keys.filter(k=>k.startsWith("bR")).length};
 const cur=state.sel&&keys.includes(state.sel)?state.sel:(keys.find(k=>!state.slots[k]&&!state.skip[k])||null);
 for(const k of keys){const n=state.slots[k],type=k[0],side=k[1],i=+k.slice(2);
  (type==="b"?d.banSlots:d.pickSlots)[side][i]=n||null;
  if(n&&k!==cur){(type==="b"?d.bans:d.picks)[side].push(n);d.used.add(n)}}
 d.curKey=cur;d.cur=cur?cur.slice(0,2):null;d.step=cur?keys.indexOf(cur):keys.length;d.total=keys.length;
 d.editing=!!(cur&&state.slots[cur]);
 d.blocked=n=>{if(!cur)return true;const side=cur[1],isBan=cur[0]==="b";
  for(const k of keys){if(k===cur||state.slots[k]!==n)continue;
   if(isBan&&rankedFmt()&&k[0]==="b"&&k[1]!==side)continue; // ranked: the other team's ban doesn't stop yours
   return true}
  return false};
 return d;
}

patchBody:`<div><b>Came out 11 Nov 2026.</b> Hero ranks come from ranked games up to 11 Nov. Heroes made weaker in this patch moved down, heroes made stronger moved up, and the reworked hero is marked as not tested yet.</div><ul>
<li><b>Made weaker:</b> Masha (S→A), Gloo (S→A), Atlas (A→B). Atlas's freeze is shorter, but he is tougher.</li>
<li><b>Reworked:</b> Popol and Kupa. Popol can now ride Kupa, and most skills are new.</li>
<li><b>Made stronger:</b> Freya, Melissa, Lunox (C→B), Xavier, Aldous, Kaja.</li>
<li><b>Small changes:</b> Lukas, Karrie, Kagura, Uranus.</li>
<li><b>Items:</b> Chastise Pauldron is weaker. Antique Cuirass is stronger.</li>
<li><b>Map:</b> Sprint comes back faster (75s). Gold lane gets more early gold. The base turret is twice as tough. Killing the enemy Turtle gives more gold.</li>
<li><b>From the last patch (2.2.16a):</b> Aulus, Hirara, Eudora and Rafaela were made weaker, Kalea stronger.</li></ul>`,

function laneOpts(h){const ov=state.laneOv&&state.laneOv[h.n];if(ov)return[[ov,0]];return LANES.map(ln=>{const k=h.lanes.indexOf(ln);return[ln,k>=0?k:6]})}
function assign(list){ // any hero may play any lane (unusual lanes just cost more); a lane the user set for a hero always wins
 let best=null,bestCost=1e9;const used={},cur=[];
 (function rec(i,cost){if(cost>=bestCost)return;if(i===list.length){bestCost=cost;best=cur.slice();return}
  for(const [ln,c] of laneOpts(list[i])){if(used[ln])continue;used[ln]=1;cur[i]=ln;rec(i+1,cost+c);used[ln]=0}})(0,0);
 return best;
}

 if(has(a,"antitank")&&has(b,"front"))s+=1.5;
 if((has(a,"suppress")||has(a,"invis")||has(a,"pick"))&&has(b,"squish"))s+=1.2;
 if(has(a,"burst")&&has(b,"squish")&&!has(b,"dash"))s+=.6;
 if(has(a,"purify")&&has(b,"eng"))s+=1;
 if(has(a,"immune")&&has(b,"eng")&&has(b,"cc"))s+=.5;
 if((has(a,"suppress"))&&has(b,"dash")&&!has(b,"immune"))s+=1;
 return s;
}

 let s=0;if(PAIR_SET[a.n+"|"+b.n])s+=PAIR_SET[a.n+"|"+b.n]===2?(isPro()?3.5:2.5):3;
 if(has(a,"eng")&&has(b,"aoe")&&b.roles.includes("M"))s+=1;
 if(has(b,"eng")&&has(a,"aoe")&&a.roles.includes("M"))s+=1;
 if((has(a,"peel")||has(a,"heal"))&&has(b,"squish")&&b.roles.includes("K"))s+=.8;

 return{n:list.length,front:c("front"),cc:c("cc")+c("suppress"),eng:c("eng"),heal:c("heal"),sus:c("sus"),peel:c("peel")+c("heal"),burst:c("burst"),late:c("late"),early:c("early"),dash:c("dash"),squish:c("squish"),P:c("P"),M:c("M"),aoe:c("aoe"),poke:c("poke")};
}
function metaPts(h){

 if(isPro()){const pr=PRO[h.n];p=p*.45+(pr?(pr[0]+pr[1])/PRO._maxPB*7+((pr[0]>=20?pr[2]/pr[0]:.5)-.5)*4:0)}

function scorePick(h,side,d){

 const R=[];let s=metaPts(h);const parts={meta:s,counter:0,lane:0};
 if(h.tier==="S")R.push([t("sTier"),1]);
 if(isPro()&&PRO[h.n]){const pr=PRO[h.n];R.push([t("usedPro",pr[0]+pr[1])+(pr[0]>=20?t("winsPct",Math.round(pr[2]/pr[0]*100)):""),1])}
 if(PATCH[h.n]==="buff")R.push([t("buffed"),1]);
 if(PATCH[h.n]==="nerf")R.push([t("nerfed"),-1]);
 const a=assign([...mine,h]);const myLane=a[a.length-1];
 if(usualLane(h,myLane)){R.push([LANE_NAME[myLane],0])}else{const pen=isPro()?2:3;s-=pen;parts.lane=-pen;R.push([t("unusualLane",LANE_NAME[myLane]),-1])}
 if(mine.length<2&&h.lanes.length>1){s+=1.2;parts.lane+=1.2;R.push([t("manyLanes"),1])}
 const beat=opp.filter(e=>counterScore(h,e)>=1.5).sort((x,y)=>counterScore(h,y)-counterScore(h,x));
 const cplus=opp.reduce((t,e)=>t+counterScore(h,e),0)*1.5;s+=cplus;if(beat.length)R.push([t("beats",names(beat)),1]);
 const lose=opp.filter(e=>counterScore(e,h)>=1.5);
 const cminus=opp.reduce((t,e)=>t+counterScore(e,h),0)*1.4;s-=cminus;parts.counter=cplus-cminus;if(lose.length)R.push([t("losesTo",names(lose)),-1]);
 const syn=mine.filter(m=>synergy(h,m)>=1);s+=mine.reduce((t,m)=>t+synergy(h,m),0)*1.2;
 const proSyn=syn.filter(m=>PAIR_SET[h.n+"|"+m.n]===2);
 if(proSyn.length)R.push([t("prosPair",names(proSyn)),1]);else if(syn.length)R.push([t("worksWith",names(syn)),1]);
 const p=profile(mine),left=5-mine.length;
 if(mine.length){
  if(!p.front&&has(h,"front")){s+=3;R.push([t("addTank"),1])}

  if(!p.eng&&has(h,"eng")){s+=1.5;R.push([t("startFights"),1])}

  if(p.M>=2&&!p.P&&has(h,"P")){s+=2.5;R.push([t("addPhys"),1])}
  if(p.M>=3&&has(h,"M")&&left<=2){s-=2;R.push([t("tooMagic"),-1])}
  if(p.P>=3&&has(h,"P")&&left<=2){s-=2;R.push([t("tooPhys"),-1])}
  if(p.squish>=2&&!p.peel&&(has(h,"peel")||has(h,"heal"))){s+=1.5;R.push([t("protects"),1])}
  if(left===1&&!p.front&&!has(h,"front")){s-=3}
 }

 if(opp.length<5){

function scoreBan(h,side,d){

 const R=[];let s=TIER_PTS[h.tier];const parts={meta:0,counter:0,lane:0};
 if(isPro()){const pr=PRO[h.n];s=s*.4+(pr?pr[1]/PRO._maxB*7+pr[0]/PRO._maxP*2:0);if(pr&&pr[1]/PRO._maxB>=.35)R.push([t("bannedPro",pr[1]),1]);

 if(PATCH[h.n]==="nerf"){s-=1.2;R.push([t("nerfed"),-1])}
 if(PATCH[h.n]==="rework")R.push([t("rework"),0]);
 parts.meta=s;
 const hurt=mine.filter(m=>counterScore(h,m)>=1.5);const thr=mine.reduce((t,m)=>t+counterScore(h,m),0)*1.6;s+=thr;parts.counter=thr;
 if(hurt.length)R.push([t("beatsYour",names(hurt)),1]);
 let elane=null;
 if(opp.length){const open=openLanes(opp);elane=h.lanes.find(l=>open.includes(l))||null;
  if(!elane){s*=.6;parts.lane=-1;R.push([t("enemyNoLane"),-1])}

 }

}

 const bal=a=>{const p=profile(a);let x=0;x+=p.front?2:-3;x+=p.cc>=2?1:-1;x+=p.eng?1:-1.5;x+=(p.P&&p.M)?1.5:-2;if(p.squish>=2)x+=p.peel?.5:-1;return x};

 const ba=assign(B)||[],ra=assign(R)||[];let lane=0;
 LANES.forEach(ln=>{const b=B[ba.indexOf(ln)],r=R[ra.indexOf(ln)];if(b&&r){const x=counterScore(b,r)-counterScore(r,b)+(TIER_PTS[b.tier]-TIER_PTS[r.tier])*.15;lane+=x>.6?1:x<-.6?-1:0}});

  {k:"wStrength",v:(avg(B)-avg(R))*.9},
  {k:"wCounters",v:(cB-cR)*.35},
  {k:"wSynergy",v:(syn(B)-syn(R))*.4},

}

  <div style="display:grid;gap:5px">${rows.map(r=>{const h=BY[r.n];return`<div class="meter" style="grid-template-columns:96px minmax(0,1fr) 92px"><span style="font-weight:600">${esc(r.n)} ${patchTag(h)}</span><div class="bar"><i style="width:${(r.p/max*100).toFixed(1)}%;background:var(--gold);float:left"></i><i style="width:${(r.b/max*100).toFixed(1)}%;background:var(--muted);float:left"></i></div><span style="text-align:right;font-variant-numeric:tabular-nums;font-size:12px">${r.p}P · ${r.b}B · ${r.p?Math.round(r.w/r.p*100):0}%</span></div>`}).join("")}
   <div class="legend"><span><i style="display:inline-block;width:10px;height:8px;background:var(--gold)"></i> ${t("lgPicks")}</span><span><i style="display:inline-block;width:10px;height:8px;background:var(--muted)"></i> ${t("lgBans")}</span><span>${t("lgWin")}</span></div></div>
  <ul class="warns">
   ${side}
   <li class="tip">${t("tip1")}</li>
   <li class="tip">${t("tip2")}</li>
   <li class="tip">${t("tip3")}</li>
   <li class="tip">${t("tip4")}</li>
  </ul>
 </div>`;
}
function itemList(b){return`<ol class="items">${b.i.map(x=>`<li><img class="ii" src="images/items/${slug(x)}.png" alt="" loading="lazy" onerror="this.remove()">${esc(x)}</li>`).join("")}</ol>`}
const pic=(dir,name)=>`<img class="ii" src="images/${dir}/${slug(name)}.png" alt="" loading="lazy" onerror="this.remove()">`;
function emblemLine(b){return`<span class="pl">${pic("emblems",b.e[0])}<b>${esc(b.e[0])}</b></span> · ${b.e.slice(1).map(x=>`<span class="pl">${pic("emblems",x)}${esc(x)}</span>`).join(" · ")}`}
const spellTag=sp=>`<span class="pl">${pic("spells",sp)}<b>${esc(sp)}</b></span>`;
function counterRows(map,eng,d){
 const rows=Object.entries(map||{}).map(([n,pp])=>({n,pp})).filter(r=>BY[r.n]);
 for(const [x,v] of eng){if(rows.length>=6)break;if(!rows.some(r=>r.n===x.n))rows.push({n:x.n,pp:null})}
 return rows.slice(0,6).map(r=>{const h=BY[r.n];const taken=d.used.has(r.n)||Object.values(state.slots).includes(r.n);
  return`<button class="crow" data-g="${esc(r.n)}">${mono(h)}<span class="cn">${esc(r.n)}</span><span class="cv">${r.pp!=null?"+"+r.pp.toFixed(1)+"%":t("kit")}</span>${taken?`<span class="chip">${t("inDraft")}</span>`:""}</button>`}).join("");
}
function laneCounters(h,d){
 const taken=n=>d.used.has(n)||Object.values(state.slots).includes(n);
 return ["e","j","m","g","r"].map(ln=>{
  const c=HEROES.filter(x=>x!==h&&x.lanes.includes(ln)).map(x=>{const pp=Math.max((CM[h.n]&&CM[h.n][x.n])||0,(CB[x.n]&&CB[x.n][h.n])||0);return{x,s:counterScore(x,h),pp}})
   .filter(o=>o.s>=1).sort((a,b)=>b.s-a.s||metaPts(b.x)-metaPts(a.x)).slice(0,2);
  if(c.length<2){ // fill with the best general answers from this lane, based on what this hero is weak to
   const g=(x,k)=>x.tags.has(k);
   const fb=HEROES.filter(x=>x!==h&&x.lanes.includes(ln)&&!c.some(o=>o.x===x)).map(x=>{let v=metaPts(x)*.2;
     if(g(h,"dash")&&(g(x,"cc")||g(x,"suppress")))v+=2;if(g(h,"squish")&&(g(x,"burst")||g(x,"pick")))v+=2;
     if(g(h,"front")&&(g(x,"antitank")||(g(x,"M")&&g(x,"dps"))))v+=1.5;if((g(h,"sus")||g(h,"heal"))&&(g(x,"antiheal")||g(x,"burst")))v+=1.2;
     if(g(h,"immune")&&g(x,"poke"))v+=1;if(g(x,"cc"))v+=.6;v-=counterScore(h,x)*.8;return{x,s:v,pp:0,fb:1}})
    .sort((a,b)=>b.s-a.s).slice(0,2-c.length);c.push(...fb)}
  return`<div class="lrow"><span class="tl">${LANE_NAME[ln]}</span><div class="lcs">${c.length?c.map(o=>`<button class="lc" data-g="${esc(o.x.n)}">${mono(o.x)}<span class="cn">${esc(o.x.n)}</span><span class="cv ${o.fb?"fb":""}">${o.pp?"+"+o.pp.toFixed(1)+"%":o.fb?t("goodInto"):t("kit")}</span>${taken(o.x.n)?`<span class="chip">${t("inDraft")}</span>`:""}</button>`).join(""):`<span class="hint">${t("noneLane")}</span>`}</div></div>`}).join("");
}
function renderGuide(d){
 const lastPick=[...d.pickSlots.B,...d.pickSlots.R].filter(Boolean).pop();
 const n=state.guide&&BY[state.guide]?state.guide:(lastPick||TOP5[0].n);const h=BY[n];const b=BUILDS[n];const top=TOP5.find(x=>x.n===n);
 const beaten=HEROES.filter(x=>x!==h).map(x=>[x,counterScore(x,h)]).filter(([,v])=>v>=1.5).sort((a,b)=>b[1]-a[1]);
 const strong=HEROES.filter(x=>x!==h).map(x=>[x,counterScore(h,x)]).filter(([,v])=>v>=1.5).sort((a,b)=>b[1]-a[1]);
 const opts=[...HEROES].sort((a,b)=>a.n.localeCompare(b.n)).map(x=>`<option value="${esc(x.n)}" ${x.n===n?"selected":""}>${esc(x.n)}</option>`).join("");
 $("guide").innerHTML=`<div class="ghead"><h3>${t("guideTitle")}</h3><label class="sr" for="gsel">${t("chooseHero")}</label><select id="gsel">${opts}</select></div>
 <div class="gtop">${mono(h)}<div><div class="gname">${esc(n)} ${tierTag(h)} ${patchTag(h)}</div><div class="sub">${h.roles.map(r=>ROLE_NAME[r]).join(" / ")} · ${h.lanes.map(l=>LANE_NAME[l]).join(" / ")}</div></div></div>
 <div class="gcols">
  <div class="gbox"><h4>${t("buildT")}</h4>${itemList(b)}
   <div class="kv"><span>${t("emblemT")}</span><span>${emblemLine(b)}</span></div>
   <div class="kv"><span>${t("spellT")}</span><span>${spellTag(b.s)}</span></div>
   <div class="src ${b.src}">${t("src_"+b.src)}</div></div>
  <div class="gbox"><h4>${t("byLane",esc(n))}</h4><div class="lanec">${laneCounters(h,d)}</div>
   <h4 style="margin-top:10px">${t("strongVs",esc(n))}</h4><div class="clist">${counterRows(CB[n],strong,d)}</div>
   <div class="hint">${t("counterNote")}</div></div>
  ${top?`<div class="gbox"><h4>${t("howTo")}</h4><ul class="tips">${top.tips[state.lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
 </div>`;
 $("gsel").onchange=e=>{state.guide=e.target.value;save();renderGuide(derive())};
}
// Current-meta pool (Patch 2.2.23): S/A tier in ranked, or 60+ picks+bans across MPL MY/PH/ID Season 18; untested reworks left out
const PRO_PB={};for(const lg in PRO_LEAGUE)for(const n in PRO_LEAGUE[lg]){const v=PRO_LEAGUE[lg][n];PRO_PB[n]=(PRO_PB[n]||0)+v[0]+v[1]}
const isMeta=h=>PATCH[h.n]!=="rework"&&(h.tier==="S"||h.tier==="A"||(PRO_PB[h.n]||0)>=60);
function metaWhy(h){const a=[];if(h.tier==="S"||h.tier==="A")a.push(t("metaTier",h.tier));if((PRO_PB[h.n]||0)>=60)a.push(t("metaPro",PRO_PB[h.n]));if(PATCH[h.n]==="buff")a.push(t("buffed"));return a.join(" · ")}
function jobFor(h,lane){const g=k=>h.tags.has(k);
 if(lane==="r"&&g("front"))return"job_tank";if(g("heal"))return"job_heal";if(g("eng")&&(g("cc")||g("suppress")))return"job_eng";if(g("peel"))return"job_peel";
 if(g("zone")||(g("aoe")&&g("cc")))return"job_control";if(g("poke"))return"job_poke";if(g("dash")&&g("burst"))return"job_dive";if(g("burst"))return"job_burst";if(g("late"))return"job_late";if(g("dps"))return"job_dps";if(g("front"))return"job_tank";return"job_def"}
function fakeDraft(names){return{picks:{B:names.slice(),R:[]},bans:{B:[],R:[]},used:new Set(names),blocked:n=>names.includes(n)}}
function slotScore(h,lane,names){const r=scorePick(h,"B",fakeDraft(names));return r.s+(h.lanes[0]===lane?1.5:0)}
function genTeam(recent){
 recent=recent||[];const order=["r","j","g","m","e"].sort(()=>Math.random()-.5);let best=null,bestQ=-1e9;
 for(let tries=0;tries<25;tries++){
  const names=[],lanes={};
  for(const ln of order){
   const cands=HEROES.filter(h=>isMeta(h)&&h.lanes.includes(ln)&&!names.includes(h.n)).map(h=>({h,s:slotScore(h,ln,names)-(recent.includes(h.n)?4:0)})).sort((a,b)=>b.s-a.s).slice(0,10);
   const min=Math.min(...cands.map(c=>c.s));let tot=0;cands.forEach(c=>{c.w=Math.pow(c.s-min+1,1.1);tot+=c.w});
   let r=Math.random()*tot,pick=cands[0];for(const c of cands){r-=c.w;if(r<=0){pick=c;break}}
   names.push(pick.h.n);lanes[pick.h.n]=ln}
  const hs=names.map(n=>BY[n]),p=profile(hs);let syn=0;for(let a=0;a<5;a++)for(let b=a+1;b<5;b++)syn+=synergy(hs[a],hs[b]);
  const ok=p.front>=1&&p.cc>=2&&p.eng>=1&&p.P>=1&&p.M>=1;
  const q=(ok?100:0)+syn*2+hs.reduce((t,h)=>t+metaPts(h),0);
  if(q>bestQ){bestQ=q;best={names,lanes}}
  if(ok&&tries>=3)break}
 return best;
}
function teamExtras(names,lanes){
 const hs=names.map(n=>BY[n]);
 const alts={};names.forEach(n=>{const ln=lanes[n],rest=names.filter(x=>x!==n);
  alts[n]=HEROES.filter(h=>isMeta(h)&&h.lanes.includes(ln)&&!names.includes(h.n)).map(h=>({n:h.n,s:slotScore(h,ln,rest)})).sort((a,b)=>b.s-a.s).slice(0,2).map(x=>x.n)});
 const bans=HEROES.filter(h=>!names.includes(h.n)).map(h=>({n:h.n,s:hs.reduce((t,m)=>t+counterScore(h,m),0)+metaPts(h)*.25})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.n);
 return{alts,bans};
}
// Fun lineup nicknames from MLBB slang, chosen by how the team plays
const LINEUP_NAMES={
 cc:["Stun Lock Squad","Freeze Frame Five","CC Lock City","No Escape Gang"],
 heal:["Unkillable Squad","Immortal Five","Anti-Savage Wall","Never Die Gang"],
 dive:["Dive Gang","Backline Hunters","Savage Hunters","Maniac Divers"],
 early:["Early Rush Gang","Gank Squad","Turtle Snatchers","First Blood Crew"],
 late:["Late Game Monsters","Lord Snatchers","Scaling Kings","Comeback Kings"],
 poke:["Poke Party","Long Range Gang","Chip Damage Crew"],
 aoe:["Wombo Combo","Teamfight Maniacs","Maniac Machine","Legendary Lineup"],
 def:["Mythic Glory Squad","Savage Squad","Triple Kill Crew","Moment Hero Five"]};
function lineupStyle(names){const p=profile(names.map(n=>BY[n]));
 if(p.cc>=4)return"cc";if(p.heal+p.sus>=3)return"heal";if(p.dash>=3)return"dive";if(p.aoe>=3)return"aoe";if(p.early>=2)return"early";if(p.late>=3)return"late";if(p.poke>=2)return"poke";return"def"}
function lineupName(names){const st=lineupStyle(names);const list=LINEUP_NAMES[st];return{st,name:list[hashStr(names.slice().sort().join("|"))%list.length]}}
function renderTeam5(){
 let rows,note,title=t("teamTitle");
 const gen=state.team5&&state.team5.names&&state.team5.names.every(n=>BY[n])?state.team5:null;
 if(gen){const ex=teamExtras(gen.names,gen.lanes);const ord=["r","e","j","m","g"];
  rows=gen.names.slice().sort((a,b)=>ord.indexOf(gen.lanes[a])-ord.indexOf(gen.lanes[b])).map(n=>({n,lane:gen.lanes[n],job:t(jobFor(BY[n],gen.lanes[n])),why:metaWhy(BY[n]),alt:ex.alts[n]}));
  note=t("genNote",ex.bans.join(", "));title+=" · "+t("lineupN",gen.no||2)}
 else{rows=TEAM5.map(x=>({n:x.n,lane:x.lane,job:x.job[state.lang],why:metaWhy(BY[x.n]),alt:x.alt}));note=t("teamNote")}
 const ln=gen?lineupName(gen.names):{st:"aoe",name:"Wombo Combo"};
 $("team5").innerHTML=`<div class="ghead"><div><h3>${esc(title)}</h3><div class="lname">“${esc(ln.name)}” <span class="chip">${t("style_"+ln.st)}</span></div></div><div class="ctl"><button class="btn" id="t5ref">↻ ${t("refresh")}</button>${gen?`<button class="btn" id="t5rec">${t("backToRec")}</button>`:""}</div></div><div class="hint">${esc(note)}</div>
 <ul class="tm5">${rows.map(x=>{const h=BY[x.n];return`<li><span class="tl">${LANE_NAME[x.lane]}</span><button class="tmh" data-g="${esc(x.n)}">${mono(h)}<span><b>${esc(x.n)}</b> ${tierTag(h)}<span class="sub">${esc(x.job)}</span>${x.why?`<span class="why">${esc(x.why)}</span>`:""}</span></button><span class="alt">${t("ifBanned")} ${x.alt.map(a=>`<button class="altb" data-g="${esc(a)}">${esc(a)}</button>`).join(", ")}</span></li>`}).join("")}</ul>`;
 $("t5ref").onclick=()=>{const recent=(state.t5recent||[]).slice(-12);let g,k=0;do{g=genTeam(recent);k++}while(k<5&&state.team5&&g.names.slice().sort().join()===state.team5.names.slice().sort().join());
  g.no=((state.team5&&state.team5.no)||1)+1;state.team5=g;state.t5recent=[...recent,...g.names].slice(-12);save();renderTeam5()};
 const rb=$("t5rec");if(rb)rb.onclick=()=>{state.team5=null;save();renderTeam5()};
}
function renderTop5(){
 $("top5").innerHTML=`<h3>${t("top5Title")}</h3><div class="hint">${t("top5Note")}</div>
 <div class="t5">${TOP5.map(x=>{const h=BY[x.n],b=BUILDS[x.n];return`<article class="t5c">
  <div class="gtop">${mono(h)}<div><div class="gname">${esc(x.n)} ${tierTag(h)} ${patchTag(h)}</div><div class="sub">${LANE_NAME[x.lane]}</div></div></div>
  <p><b>${t("whyMeta")}:</b> ${esc(x.why[state.lang])}</p>
  <div class="mini">${b.i.map(esc).join(" → ")}</div>
  <div class="mini">${emblemLine(b)} · ${spellTag(b.s)}</div>
  <ul class="tips">${x.tips[state.lang].slice(0,2).map(z=>`<li>${esc(z)}</li>`).join("")}</ul>
  <button class="btn" data-g="${esc(x.n)}">${t("openGuide")}</button></article>`}).join("")}</div>`;
}
const VIEWS=["draft","heroes","lineups","meta"];
function route(){const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"draft";
 document.querySelectorAll("section[data-view]").forEach(el=>{if(el.id==="onb")el.hidden=v!=="draft"||!!state.onbDone;else el.hidden=el.dataset.view!==v});
 document.querySelectorAll("[data-nav]").forEach(a=>{if(a.dataset.nav===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
 document.body.dataset.page=v}
function goView(v){if(location.hash!=="#"+v)location.hash=v;else route();try{window.scrollTo({top:0})}catch(e){}}
function openGuide(n){if(!BY[n])return;state.guide=n;save();renderGuide(derive());goView("heroes")}
let toastT=null;
function toast(msg,canUndo){const el=$("toast");el.innerHTML=`<span>${esc(msg)}</span>${canUndo?`<button id="tUndo">${t("undo")}</button>`:""}`;el.hidden=false;
 const u=$("tUndo");if(u)u.onclick=()=>{undo();el.hidden=true};clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3500)}
function renderOnb(){const el=$("onb");el.innerHTML=`<div class="onb-in"><h3>${t("onbTitle")}</h3><ol><li>${t("onb1")}</li><li>${t("onb2")}</li><li>${t("onb3")}</li></ol><button class="btn primary" id="onbOk">${t("gotIt")}</button></div>`;
 $("onbOk").onclick=()=>{state.onbDone=true;save();route()}}
function render(){
 applyStatic();renderOnb();route();buildPro();const d=derive();lastRanked=ranked(d);
 renderPhase(d);renderTeam("B",d);renderTeam("R",d);renderAdvisor(d);renderAnalysis(d);renderPool(d);renderGuide(d);renderTeam5();renderTop5();renderPro();
 $("fmt").value=state.fmt;$("meta").value=state.meta;
 $("undo").disabled=!state.hist.length;
}
function act(n){const d=derive();if(!d.curKey||d.blocked(n)||!BY[n])return;const k=d.curKey;setTimeout(()=>toast(t(k[0]==="b"?"toastBan":"toastPick",n,t(k[1]==="B"?"Blue":"Red")),true),0);if(document.activeElement&&document.activeElement.id==="advq")advFocus=true;advQ="";
 state.hist.push({k,prev:state.slots[k]||null,sk:!!state.skip[k]});state.slots[k]=n;delete state.skip[k];state.sel=null;if(k[0]==="p")state.guide=n;save();render()}
function skipBan(all){const d=derive();
 const ks=all?d.keys.filter(k=>k[0]==="b"&&!state.slots[k]&&!state.skip[k]):(d.curKey&&d.curKey[0]==="b"&&!state.slots[d.curKey]?[d.curKey]:[]);
 if(!ks.length)return;state.hist.push({multi:ks.map(k=>({k,prev:null,sk:false}))});ks.forEach(k=>state.skip[k]=1);state.sel=null;save();render()}
function clearSlot(){const k=state.sel;if(!k||!state.slots[k])return;state.hist.push({k,prev:state.slots[k],sk:false});delete state.slots[k];save();render()}
function undo(){const h=state.hist.pop();if(!h)return;(h.multi||[h]).forEach(e=>{if(e.prev)state.slots[e.k]=e.prev;else delete state.slots[e.k];if(e.sk)state.skip[e.k]=1;else delete state.skip[e.k]});state.sel=null;save();render()}
function reset(){state.slots={};state.skip={};state.hist=[];state.sel=null;state.laneOv={};save();render()}
function cycleLane(n){const d=derive();const side=d.pickSlots.B.includes(n)?"B":"R";const list=d.pickSlots[side].filter(Boolean).map(x=>BY[x]);
 const a=assign(list)||[];const cur=a[list.findIndex(h=>h.n===n)];state.laneOv=state.laneOv||{};
 const next=LANES[(LANES.indexOf(cur)+1)%LANES.length];state.laneOv[n]=next;
 // if a teammate already had that lane set by hand, give them this hero's old lane
 for(const h of list)if(h.n!==n&&state.laneOv[h.n]===next)state.laneOv[h.n]=cur;
 save();render()}
function selectSlot(k){if(!k)return;if(state.sel===k){state.sel=null}else{state.sel=k;if(state.skip[k])delete state.skip[k]}save();render()}

$("grid").addEventListener("click",e=>{const b=e.target.closest(".hero");if(b&&!b.disabled)act(b.dataset.n)});
document.addEventListener("click",e=>{const lb=e.target.closest("[data-lane]");if(lb){e.preventDefault();cycleLane(lb.dataset.lane);return}
 const g=e.target.closest("[data-g]");if(g){e.preventDefault();openGuide(g.dataset.g);return}
 const k=e.target.closest("[data-k]");if(k&&(k.closest(".board")||k.closest(".dbar")))selectSlot(k.dataset.k)});
document.addEventListener("keydown",e=>{const k=e.target.closest&&e.target.closest(".pick[data-k]");if(k&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selectSlot(k.dataset.k)}});
$("undo").onclick=undo;
let resetArm=null;
$("reset").onclick=()=>{if(resetArm){clearTimeout(resetArm);resetArm=null;$("reset").classList.remove("arm");$("resetLbl").textContent=t("reset");reset();toast(t("resetDone"),false);return}
 $("reset").classList.add("arm");$("resetLbl").textContent=t("resetConfirm");resetArm=setTimeout(()=>{resetArm=null;$("reset").classList.remove("arm");$("resetLbl").textContent=t("reset")},3000)};
addEventListener("hashchange",route);
$("fmt").onchange=e=>{state.fmt=e.target.value;state.slots={};state.skip={};state.hist=[];state.sel=null;save();render()};
$("meta").onchange=e=>{state.meta=e.target.value;save();render()};
$("lEN").onclick=()=>{state.lang="en";save();render()};
$("lMS").onclick=()=>{state.lang="ms";save();render()};
["q","fRole","fLane","fSort"].forEach(id=>$(id).addEventListener("input",()=>{poolPage=1;renderPool(derive())}));
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="z"&&!["INPUT","SELECT"].includes(document.activeElement.tagName)){e.preventDefault();undo()}});
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
